name: LexyClient 4.0 Startup Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Xvfb
        run: |
          command -v xvfb-run || { sudo apt-get update -qq && sudo apt-get install -y xvfb; }
      - name: Launch Fabric + LexyClient in a virtual display
        shell: bash
        run: |
          set +e
          timeout --signal=TERM 105s env ALSOFT_DRIVERS=null xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient --console=plain --no-daemon > lexy-startup.log 2>&1
          exitcode=$?
          set -e
          echo "Client exited: $exitcode; 124 is an expected time limit"
          tail -n 75 lexy-startup.log
          if ! grep -F '[LexyClient 4.0.0] Client entrypoint invoked' lexy-startup.log; then
            echo "::error::Lexy 4.0 Fabric entrypoint did not run"
            exit 1
          fi
          if ! grep -E 'Reloading ResourceManager:.*lexy-client' lexy-startup.log; then
            echo "::error::Lexy 4.0 resources were not registered"
            exit 1
          fi
          if grep -E 'A crash report has been saved|Exception in thread "Render thread"|Failed to start the minecraft client' lexy-startup.log; then
            echo "::error::Minecraft emitted a startup crash"
            exit 1
          fi
          if ! grep -E 'Custom title screen initialized|Title screen fallback button initialized' lexy-startup.log; then
            echo "::warning::Headless test did not finish title-screen initialization: GUI click behavior unverified"
          fi
      - name: Upload startup diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LexyClient-4.0-startup-log
          path: |
            lexy-startup.log
            run/logs/latest.log
          if-no-files-found: warn